<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Smart Campus</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f3f4f8;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand .brand-icon {
            margin: 0 auto 12px;
        }

        .login-box h1 {
            color: #263b80;
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #263b80;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbea;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #5145e5;
            box-shadow: 0 0 0 3px rgba(81, 69, 229, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #263b80;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1c2e68;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-links {
            text-align: center;
            margin-top: 22px;
            line-height: 2;
            color: #64748b;
        }

        .login-links a,
        .back-link {
            color: #263b80;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <div class="login-brand">
            <div class="brand-icon">🎓</div>
            <h2>Smart Campus</h2>
        </div>

        <h1>Student Login</h1>

        <p class="subtitle">
            Welcome back! Login to explore placement opportunities.
        </p>


        <form id="studentLoginForm">

            <div class="input-group">

                <label for="studentEmail">Email Address</label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="studentPassword">Password</label>

                <input
                    type="password"
                    id="studentPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Login to Student Portal
            </button>

        </form>


        <div class="login-links">

            <a href="forgot-password.html">Forgot Password?</a>

            <br><br>

            New Student?

            <a href="register.html">Register Here</a>

        </div>


        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </main>


    <script src="./script.js"></script>

</body>
</html>
